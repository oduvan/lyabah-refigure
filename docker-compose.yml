name: ${SERVICE_NAME}

# refigure.lyabah.com — a Go binary with the React site embedded in it.
#
# It attaches to the shared `shared` network so Traefik can route to it, and
# runs nothing else: no Postgres, no Redis, no mail. The landing site keeps no
# state, so the shared Postgres/Redis connection strings are deliberately NOT
# injected here (see .env.example).
#
# Per-service values come from `.env`; Compose interpolates them at deploy time.

services:
  app:
    image: ${SERVICE_NAME}:latest   # local tag only — built on the server, never pushed
    build: .
    restart: unless-stopped
    # List form on purpose: a name with no value is passed through only when
    # `.env` actually defines it. The `KEY: ${KEY:-}` form would instead set it
    # to an empty string, and the binary could not tell "not configured" from
    # "deliberately blank" (which is what REFIGURE_WINDOWS_SIZE is).
    environment:
      # Which release the download buttons point at. Shipping a new build of
      # the desktop app is an .env edit plus `./scripts/deploy.sh` — the site
      # itself does not need rebuilding.
      - REFIGURE_VERSION
      - REFIGURE_MAC_URL
      - REFIGURE_MAC_SIZE
      - REFIGURE_WINDOWS_URL
      - REFIGURE_WINDOWS_SIZE
      - REFIGURE_LINUX_URL
      - REFIGURE_LINUX_SIZE
      # Set to SERVICE_HOST to 301 every other hostname to the canonical one.
      - REFIGURE_CANONICAL_HOST
      - LOG_LEVEL
    networks:
      - shared
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=true
      - traefik.http.routers.${SERVICE_NAME}.rule=Host(`${SERVICE_HOST}`)
      - traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure
      - traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=8080

networks:
  # External — owned by the infra repo. Never created here.
  shared:
    external: true
    name: ${SHARED_NETWORK:-shared}
